  <title>Pocket 4Cut — four-cut print and film themed icon</title>
  <desc>Single-color adaptation with four transparent photo windows, six film perforations, and a narrow transparent seam. The print is tilted minus five degrees and the film plus five degrees. All outer vertices stay within a 30.017 dp radius around 54,54.</desc>
